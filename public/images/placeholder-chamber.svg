<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none">
  <rect width="1200" height="600" fill="#F7F3EA"/>
  <rect x="24" y="24" width="1152" height="552" stroke="#E5E0D7" stroke-width="2"/>
  
  <!-- Subtle architectural legal chamber bookshelf background abstraction -->
  <g opacity="0.12">
    <line x1="100" y1="120" x2="1100" y2="120" stroke="#10243A" stroke-width="3"/>
    <line x1="100" y1="240" x2="1100" y2="240" stroke="#10243A" stroke-width="3"/>
    <line x1="100" y1="360" x2="1100" y2="360" stroke="#10243A" stroke-width="3"/>
    <line x1="100" y1="480" x2="1100" y2="480" stroke="#10243A" stroke-width="3"/>
    <!-- Vertical supports -->
    <line x1="200" y1="80" x2="200" y2="520" stroke="#10243A" stroke-width="4"/>
    <line x1="500" y1="80" x2="500" y2="520" stroke="#10243A" stroke-width="4"/>
    <line x1="800" y1="80" x2="800" y2="520" stroke="#10243A" stroke-width="4"/>
    <line x1="1000" y1="80" x2="1000" y2="520" stroke="#10243A" stroke-width="4"/>
  </g>

  <!-- Restrained placeholder label -->
  <rect x="420" y="270" width="360" height="60" rx="6" fill="#10243A"/>
  <text x="600" y="306" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#F7F3EA" text-anchor="middle" letter-spacing="0.08em">
    OFFICE / CHAMBER PHOTOGRAPH
  </text>
  <text x="600" y="360" font-family="Inter, sans-serif" font-size="13" fill="#596579" text-anchor="middle">
    Awaiting verified office and chamber photographs (Gurugram / Delhi NCR)
  </text>
</svg>
